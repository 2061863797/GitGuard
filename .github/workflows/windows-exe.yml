name: Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = 'v' + (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expected"
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build Windows executable
        run: pnpm run build:exe

      - name: Test standalone executable
        run: pnpm run test:exe

      - name: Prepare download files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist-exe/release -Force | Out-Null
          Copy-Item -LiteralPath dist-exe/GitGuard.exe -Destination dist-exe/release/GitGuard.exe
          Copy-Item -LiteralPath docs/windows-exe.zh-CN.md -Destination dist-exe/release/README-Windows.md
          $hash = (Get-FileHash -LiteralPath dist-exe/release/GitGuard.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  GitGuard.exe" | Set-Content -LiteralPath dist-exe/release/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: GitGuard-Windows-x64
          path: dist-exe/release/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested executable
        uses: actions/download-artifact@v4
        with:
          name: GitGuard-Windows-x64
          path: release-files

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          zip -j GitGuard-Windows-x64.zip release-files/GitGuard.exe release-files/README-Windows.md release-files/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" release-files/GitGuard.exe GitGuard-Windows-x64.zip release-files/SHA256SUMS.txt --verify-tag --generate-notes
