# GitGuard repository configuration
# Deterministic checks run these commands; secret scanning is always on.
# Rules below are checked on every run in addition to the agent's own rules.
version: 1

deterministic:
  test:
    run: "pnpm test"
    timeout_ms: 300000
  lint:
    run: "pnpm lint"
    timeout_ms: 60000
  typecheck:
    run: "pnpm typecheck"
    timeout_ms: 60000

rules:
  - id: bundle_up_to_date
    rule: "修改 src/ 下的代码时，必须同时更新打包产物 plugins/gitguard/server/gitguard-mcp.mjs"
    level: review
    files: ["src/**", "plugins/gitguard/server/**"]
  - id: versions_in_sync
    rule: "package.json、src/version.ts 和两个 plugin.json 中的版本号必须保持一致"
    level: review
    files: ["package.json", "src/version.ts", "plugins/gitguard/**/plugin.json"]
