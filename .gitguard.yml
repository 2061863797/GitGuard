# GitGuard repository configuration
# Deterministic checks run these commands; secret scanning is always on.
# Questions below are asked on every check in addition to the agent's own questions.
version: 1

deterministic:
  test:
    run: "pnpm test"
    timeout_ms: 300000
  lint:
    run: "pnpm lint"
    timeout_ms: 60000
  typecheck:
    run: "pnpm typecheck"
    timeout_ms: 60000

questions:
  - id: bundle_out_of_date
    question: "Does this change modify files under src/ without also updating the generated bundle plugins/gitguard/server/gitguard-mcp.mjs?"
    level: review
    files: ["src/**", "plugins/gitguard/server/**"]
  - id: plugin_versions_diverge
    question: "Does this change bump the version in package.json, src/version.ts or a plugin.json without updating all of them to the same version?"
    level: review
    files: ["package.json", "src/version.ts", "plugins/gitguard/**/plugin.json"]
